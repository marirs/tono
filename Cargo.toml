[package]
name = "tono"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
resvg = "0.48.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
fs2 = "0.4"
tempfile = "3"
sha2 = "0.11"
flate2 = "1"
tar = "0.4"
same-file = "1"
