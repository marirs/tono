name: Release packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: tono-release
          environment-file: scripts/release_environment.yml
          use-mamba: true
      - name: Check Rust
        run: |
          cargo fmt --check
          cargo test --locked
      - name: Install CPU ML dependencies
        env:
          # sphn builds audiopus_sys/Opus from source on Linux ARM64 and Intel macOS.
          # Its bundled CMake project predates CMake 4 policy requirements.
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: |
          if [[ "$RUNNER_OS" == "Linux" || "$RUNNER_OS" == "Windows" ]]; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install -r ml/requirements.txt
          python -m pip check
      - name: Package and exercise runtime
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python scripts/package_runtime.py --target "$RELEASE_TARGET" --out "$RUNNER_TEMP/tono-release" --repository "$GITHUB_REPOSITORY"
      - name: Compile pinned binary and test isolated first use
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python scripts/release_artifacts.py --target "$RELEASE_TARGET" --out "$RUNNER_TEMP/tono-release"
      - uses: actions/upload-artifact@v4
        with:
          name: tono-${{ matrix.target }}
          path: ${{ runner.temp }}/tono-release/*
          compression-level: 0
          if-no-files-found: error
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create draft release after every package passes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes release/*
