name: Check
on:
  push:
    branches: [main, master]
    # Only code, runtime data, tests, dependencies and build/CI inputs.
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'examples/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.cargo/**'
      - 'rust-toolchain'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - '.rustfmt.toml'
      - 'clippy.toml'
      - '.clippy.toml'
      - 'ml/**'
      - 'instruments/*.json'
      - 'instruments/*.py'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '!**/*.md'
      - '!**/*.MD'
  pull_request:
    # Only code, runtime data, tests, dependencies and build/CI inputs.
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'examples/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.cargo/**'
      - 'rust-toolchain'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - '.rustfmt.toml'
      - 'clippy.toml'
      - '.clippy.toml'
      - 'ml/**'
      - 'instruments/*.json'
      - 'instruments/*.py'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '!**/*.md'
      - '!**/*.MD'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo build --release --locked

  # Lightweight Python ML-worker contract checks: no models, no inference.
  # Heavy dependencies (torch, demucs, basic-pitch, librosa) are not installed;
  # full inference stays a local/manual check (tono doctor --ml, real songs).
  python-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy soundfile pyyaml huggingface_hub
      - run: python -m compileall -q ml/analyze.py ml/tono_ml ml/tests
      - run: python -m unittest discover -s ml/tests -v
