name: Check
on:
  push:
    branches: [main, master]
    # Only code, runtime data, tests, dependencies and build/CI inputs.
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'examples/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.cargo/**'
      - 'rust-toolchain'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - '.rustfmt.toml'
      - 'clippy.toml'
      - '.clippy.toml'
      - 'ml/**'
      - 'instruments/*.json'
      - 'instruments/*.py'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '!**/*.md'
      - '!**/*.MD'
  pull_request:
    # Only code, runtime data, tests, dependencies and build/CI inputs.
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'examples/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.cargo/**'
      - 'rust-toolchain'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - '.rustfmt.toml'
      - 'clippy.toml'
      - '.clippy.toml'
      - 'ml/**'
      - 'instruments/*.json'
      - 'instruments/*.py'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '!**/*.md'
      - '!**/*.MD'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo build --release --locked
